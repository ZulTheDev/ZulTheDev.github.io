name: Deploy Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy Client
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          package-manager-cache: false

      - name: Install client dependencies
        working-directory: client
        run: npm install

      - name: Verify client assets
        shell: bash
        run: |
          set -e
          if [ -f "client/public/content.json" ]; then
            echo "FOUND: client/public/content.json"
          else
            echo "ERROR: client/public/content.json is missing"
            exit 1
          fi

          if [ -f "client/public/images/profile.png" ]; then
            echo "FOUND: client/public/images/profile.png"
          elif [ -f "client/public/profile.png" ]; then
            echo "FOUND: client/public/profile.png"
            cp "client/public/profile.png" "client/public/images/profile.png"
          elif [ -f "client/public/images/profile.jpg" ]; then
            echo "FOUND: client/public/images/profile.jpg"
            cp "client/public/images/profile.jpg" "client/public/images/profile.png"
          elif [ -f "client/public/profile.jpg" ]; then
            echo "FOUND: client/public/profile.jpg"
            cp "client/public/profile.jpg" "client/public/images/profile.png"
          else
            echo "ERROR: no profile image found"
            exit 1
          fi

      - name: Build client
        working-directory: client
        env:
          VITE_API_BASE_URL: https://system32.tail39684d.ts.net
        run: npm run build

      - name: Verify build output
        shell: bash
        run: |
          set -e

          if [ -f "client/dist/index.html" ]; then
            echo "FOUND: client/dist/index.html"
          else
            echo "ERROR: client/dist/index.html is missing"
            exit 1
          fi

          if [ -f "client/dist/content.json" ]; then
            echo "FOUND: client/dist/content.json"
          else
            echo "ERROR: client/dist/content.json is missing"
            exit 1
          fi

          if [ -f "client/dist/images/profile.png" ]; then
            echo "FOUND: client/dist/images/profile.png"
          else
            echo "ERROR: client/dist/images/profile.png is missing"
            exit 1
          fi

          echo "Build output:"
          find client/dist -maxdepth 3 -type f | sort

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload client/dist
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./client/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
