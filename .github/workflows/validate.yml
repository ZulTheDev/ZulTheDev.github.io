name: Validate portfolio

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install and build client
        working-directory: client
        run: |
          npm install
          npm run build

      - name: Install and build admin
        working-directory: admin
        run: |
          npm install
          npm run build

      - name: Check server JavaScript
        run: |
          node --check server/src/index.js
          node --check server/src/monetization.js
          node --check server/src/writeups.js
          node --check server/src/github-app.js
